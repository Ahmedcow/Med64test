<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c7c8c">
<meta name="description" content="MedEx medical examination and study platform">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>MedEX — Medical Examination Platform</title>

<!-- Vercel Web Analytics: enabled when deployed on Vercel -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f0;--card:#ffffff;--text:#101826;--muted:#5b6b72;--line:#dbe3e1;
  --primary:#0c7c8c;--primary2:#095f6c;--primary-rgb:12,124,140;--primary-soft:#e1f0f0;
  --danger:#c0392b;--danger-soft:#fbeae7;
  --ok:#1f8a55;--ok-soft:#e7f5ec;
  --warn:#b4780a;--warn-soft:#fbf0de;
  --ink:#101826;
  --shadow:0 20px 40px -18px rgba(16,24,38,.35);
  --shadow-sm:0 1px 2px rgba(16,24,38,.06);
  --radius:16px;--radius-sm:10px;
  --topbar-h:58px;--sidebar-w:264px;
  --font-sans:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --font-serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#0f1517;--card:#182023;--text:#e7edee;--muted:#8fa0a5;--line:#2b363a;
  --primary:#20b6c9;--primary2:#57cddc;--primary-rgb:32,182,201;--primary-soft:rgba(32,182,201,.16);
  --danger:#e5695a;--danger-soft:rgba(229,105,90,.16);
  --ok:#3fcf85;--ok-soft:rgba(63,207,133,.16);
  --warn:#e0a63f;--warn-soft:rgba(224,166,63,.16);
  --ink:#05090a;
  --shadow:0 20px 40px -18px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-serif);font-weight:600;letter-spacing:-.01em;margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;animation-duration:.001ms!important}}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.5);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:40}
.app.sidebar-open .scrim{opacity:1;pointer-events:auto}
.appshell{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:var(--topbar-h);padding:0 18px;background:rgba(238,242,240,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-brand{font-family:var(--font-serif);font-size:17px;font-weight:600}
.topbar-brand small{display:block;font-family:var(--font-sans);font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:.02em;margin-top:-2px}
.icon-btn{width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);border-radius:10px;transition:border-color .15s ease,background .15s ease}
.section-start-btn{width:30px;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--primary);background:var(--primary-soft);border-radius:50%;cursor:pointer;transition:transform .12s ease,background .15s ease}
.section-start-btn:hover{background:var(--primary);transform:scale(1.08)}
.section-start-btn:hover svg{stroke:#fff;fill:#fff}
.section-start-btn svg{width:13px;height:13px;stroke:var(--primary);fill:var(--primary);margin-left:1px}
.icon-btn:hover{border-color:var(--primary)}
.icon-btn svg{width:18px;height:18px;stroke:var(--text);fill:none}
.main{flex:1;padding:24px;max-width:1500px;width:100%}

/* ---------- Sidebar window ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);max-width:86vw;background:var(--ink);color:#fff;z-index:50;transform:translateX(-105%);transition:transform .25s ease;box-shadow:var(--shadow)}
.app.sidebar-open .sidebar{transform:translateX(0)}
.sidebar-inner{width:var(--sidebar-w);max-width:86vw;height:100%;display:flex;flex-direction:column;padding:16px 14px;overflow-y:auto}
.sidebar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 6px 20px}
.brand{font-family:var(--font-serif);font-size:20px;font-weight:600;line-height:1.15}
.brand small{display:block;font-family:var(--font-sans);font-size:11px;font-weight:500;color:#93a6ab;margin-top:6px;letter-spacing:.01em}
.sidebar .icon-btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.sidebar .icon-btn svg{stroke:#fff}
.sidebar .icon-btn:hover{border-color:var(--primary)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#c6d1d5;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;position:relative}
.nav button svg{width:18px;height:18px;flex:0 0 auto;opacity:.85;stroke:currentColor;fill:none}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:rgba(var(--primary-rgb),.28);color:#fff}
.nav button.active svg{opacity:1}
.sidebar-foot{margin-top:auto;padding:14px 10px 4px;font-size:11.5px;color:#93a6ab;border-top:1px solid rgba(255,255,255,.12)}
@media(min-width:881px){
  .sidebar{position:sticky;top:16px;height:calc(100vh - 32px);margin:16px 0 16px 16px;border-radius:var(--radius);width:var(--sidebar-w);transform:none;transition:width .22s ease,opacity .18s ease,margin .22s ease;overflow:hidden}
  .app:not(.sidebar-open) .sidebar{width:0;margin-left:0;opacity:0;box-shadow:none;pointer-events:none}
  .scrim{display:none}
}

/* ---------- Page header ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:26px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Buttons & fields ---------- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;transition:border-color .15s ease,background .15s ease,transform .1s ease}
.btn:hover{border-color:var(--primary)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary2);border-color:var(--primary2)}
.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.btn.btn-lg{padding:15px 28px;font-size:16px;border-width:2px}
.btn.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:10px;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{min-height:130px;resize:vertical;font-family:var(--font-mono);font-size:13px}

/* ---------- Cards & readouts ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm)}
.stat{position:relative;overflow:hidden;padding-top:20px}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary)}
.stat .label{color:var(--muted);font-size:12.5px}
.stat .value{font-family:var(--font-mono);font-size:28px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.section-title{margin:28px 0 12px;font-size:17px}
.bar{height:8px;background:#e3e9e7;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:999px}
.progress-row{display:grid;grid-template-columns:180px 1fr 70px 80px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.progress-row:last-child{border-bottom:0}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;background:var(--primary-soft);color:var(--primary2);font-family:var(--font-mono)}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
.table th{color:var(--muted);font-size:12px;background:var(--bg)}
.hidden{display:none!important}

/* ---------- Quiz ---------- */
.quiz{max-width:980px;margin:auto}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.timer{font-family:var(--font-mono);font-weight:600;color:var(--primary);font-size:17px}
.question{font-family:var(--font-serif);font-size:21px;line-height:1.5;font-weight:600;margin:18px 0}
.options{display:grid;gap:10px}
.option{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:14px;text-align:left;transition:border-color .15s ease,background .15s ease}
.option:hover{border-color:var(--primary)}
.option.selected{border-color:var(--primary);background:var(--primary-soft)}
.option.correct{border-color:var(--ok);background:var(--ok-soft)}
.option.wrong{border-color:var(--danger);background:var(--danger-soft)}

/* ---------- Exam question navigator ---------- */
.question-nav{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius)}
.qnav-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;cursor:pointer;font-family:var(--font-mono);transition:all .15s ease}
.qnav-btn:hover{border-color:var(--primary);transform:translateY(-1px)}
.qnav-btn.current{border:2px solid var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.qnav-btn.answered{background:var(--ok);border-color:var(--ok);color:#fff}
.qnav-btn.current.answered{box-shadow:0 0 0 2px var(--ok-soft),0 0 0 4px var(--primary)}
.qnav-btn.wrong{background:var(--danger);border-color:var(--danger);color:#fff}
.qnav-btn.current.wrong{box-shadow:0 0 0 2px var(--danger-soft),0 0 0 4px var(--primary)}
.nav-legend{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted)}
.nav-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line);background:var(--card);margin-right:4px}
.nav-dot.answered{background:var(--ok);border-color:var(--ok)}
.nav-dot.wrong{background:var(--danger);border-color:var(--danger)}
.nav-dot.current{border:2px solid var(--primary)}
.review-choice{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:7px;background:var(--card)}
.review-choice.selected{border-color:var(--primary);background:var(--primary-soft)}
.review-choice.correct{border-color:var(--ok);background:var(--ok-soft)}
.review-choice.selected.correct{border-color:var(--ok);background:var(--ok-soft)}
.review-choice.wrong{border-color:var(--danger);background:var(--danger-soft)}

.review{margin-top:14px;padding:14px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--line)}
.review.good{border-left:4px solid var(--ok)}
.review.bad{border-left:4px solid var(--danger)}
.quiz-footer{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.notice{padding:11px 13px;border-radius:var(--radius-sm);background:var(--primary-soft);color:var(--primary2);font-size:13px}
.notice.error{background:var(--danger-soft);color:#8a291d}
.notice.ok{background:var(--ok-soft);color:#136b40}
.empty{text-align:center;padding:38px;color:var(--muted)}
.category-card{padding:15px;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:9px}
.category-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mini{font-size:12px;color:var(--muted)}

/* ---------- Phase 3 AI review ---------- */
.ai-edit{margin-top:12px;padding:14px;border:1px dashed var(--primary);border-radius:var(--radius-sm);background:var(--primary-soft)}
.ai-edit textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:9px;color:var(--text);margin-top:5px;min-height:90px;resize:vertical}
.ai-edit input,.ai-edit select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:9px;color:var(--text);margin-top:5px}
.ai-duplicate{border-left:4px solid var(--warn)}

/* ---------- AI assistant ---------- */
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--primary2);background:var(--primary-soft);border-radius:999px;padding:3px 10px}
.tabbar{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabbar button{border:0;background:transparent;padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar button:hover{color:var(--text)}
.tabbar button.active{color:var(--primary);border-bottom-color:var(--primary)}
.chat-log{max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px}
.chat-msg{padding:11px 14px;border-radius:14px;max-width:82%;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.chat-msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.chat-msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-msg.error{align-self:flex-start;background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.chat-input-row{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.chat-input-row textarea{flex:1;min-height:46px;max-height:140px}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:inline-block;animation:spin .7s linear infinite;margin-right:7px;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.diff-pill{font-family:var(--font-mono);font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;text-transform:capitalize}
.diff-pill.easy{background:var(--ok-soft);color:var(--ok)}
.diff-pill.medium{background:var(--warn-soft);color:var(--warn)}
.diff-pill.hard{background:var(--danger-soft);color:var(--danger)}

@media(max-width:1000px){.stats,.filters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.main{padding:16px}.stats,.filters,.two,.three{grid-template-columns:1fr}.progress-row{grid-template-columns:1fr 1fr}}

/* Phase 4: accessibility, mobile and offline UX */
.skip-link{position:fixed;left:12px;top:-60px;z-index:9999;padding:10px 14px;border-radius:10px;background:var(--primary);color:#fff;font-weight:800;text-decoration:none}.skip-link:focus{top:12px}
:focus-visible{outline:3px solid var(--primary2);outline-offset:3px}
.offline-banner{position:fixed;top:0;left:0;right:0;z-index:9998;padding:8px 14px;text-align:center;background:var(--warn);color:#111;font-weight:800;font-size:13px}
@media(max-width:700px){.topbar{padding-top:max(8px,env(safe-area-inset-top));min-height:calc(var(--topbar-h) + env(safe-area-inset-top))}.main{padding:12px}.card{border-radius:12px}.btn,.nav button{min-height:44px}.option{min-height:52px;padding:14px}.quiz-footer{position:sticky;bottom:8px;z-index:20;padding:8px;border-radius:12px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);box-shadow:var(--shadow-sm)}.question-nav{overflow-x:auto}.question-nav button{min-width:44px}.table-wrap{overflow-x:auto}.table{min-width:720px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="offlineBanner" class="offline-banner" role="status" aria-live="polite" hidden>You are offline. Cached questions and saved exam data remain available.</div>
<div class="app">
<div class="scrim" id="scrim"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-head">
      <div class="brand">MedEx<small>Medical Examination Platform</small></div>
      <button class="icon-btn" id="sidebarClose" aria-label="Close menu"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="4" x2="16" y2="16"/><line x1="16" y1="4" x2="4" y2="16"/></svg></button>
    </div>
    <div class="nav">
      <button data-view="dashboard"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linejoin="round"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></button>
      <button data-view="exam"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="12" height="15" rx="2"/><rect x="7" y="1.3" width="6" height="3" rx="1"/><line x1="7" y1="9" x2="13" y2="9"/><line x1="7" y1="12.4" x2="13" y2="12.4"/><line x1="7" y1="15.8" x2="10.5" y2="15.8"/></svg><span>Start Exam</span></button>
      <button data-view="progress"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,15 7,9.5 10.5,12.5 17.5,4"/><polyline points="12.5,4 17.5,4 17.5,9"/></svg><span>Progress & Accuracy</span></button>
      <button data-view="history"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10.5" r="7.5"/><polyline points="10,6 10,10.5 13.2,12.6"/><polyline points="3.5,2 3.5,5 6.5,5"/></svg><span>Exam History</span></button>
      <button data-view="mistakes"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.5"/><line x1="7.3" y1="7.3" x2="12.7" y2="12.7"/><line x1="12.7" y1="7.3" x2="7.3" y2="12.7"/></svg><span>Mistakes</span></button>
      <button data-view="weak"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,14 7,10 10,12 17,5"/><polyline points="13,5 17,5 17,9"/></svg><span>Weak Topics</span></button>
      <button data-view="favorites"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linejoin="round"><path d="M10 16.8 3.6 10.4A4.1 4.1 0 0 1 9.4 4.6L10 5.2l.6-.6a4.1 4.1 0 0 1 5.8 5.8L10 16.8Z"/></svg><span>Favorites</span></button>
      <button data-view="bank" id="bankNav"><svg viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="10,2 18,6.5 10,11 2,6.5"/><polyline points="2,10.5 10,15 18,10.5"/><polyline points="2,14.5 10,19 18,14.5"/></svg><span>Question Bank</span></button>

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function attrJs(v){
  return String(v ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'\\u003c');
}
function uid(q){ return String(q.id || '').trim(); }
function key(q){ return uid(q); }

function normalizeQuestion(q, source=''){
  const options = Array.isArray(q.options) ? q.options.map(x=>String(x)) : [];
  let ci = Number.isInteger(q.correctIndex) ? q.correctIndex : Number(q.correctIndex);
  if(!Number.isInteger(ci)) ci = -1;
  return {
    id: uid(q),
    module: String(q.module || q.section || 'General').trim() || 'General',
    subject: String(q.subject || q.category || 'General').trim() || 'General',
    lecture: String(q.lecture || 'General').trim() || 'General',
    difficulty: String(q.difficulty || '').trim(),
    reference: String(q.reference || '').trim(),
    question: String(q.question || '').trim(),
    options,
    correctIndex: ci,
    explanation: String(q.explanation || '').trim(),
    source: source || String(q.source || '')
  };
}
function validateQuestion(q, i){
  if(!q.id) return 'Missing id';
  if(!q.question) return 'Missing question';
  if(!Array.isArray(q.options) || q.options.length < 2) return 'At least 2 options required';
  if(!Number.isInteger(q.correctIndex) || q.correctIndex < 0 || q.correctIndex >= q.options.length) return 'Invalid correctIndex';
  if(!q.module) return 'Missing module';
  if(!q.subject) return 'Missing subject';
  if(!q.lecture) return 'Missing lecture';
  return '';
}
function validateBank(list){
  const errors=[], seen=new Set();
  list.forEach((raw,i)=>{
    const q=normalizeQuestion(raw, raw.source);
    const err=validateQuestion(q,i);
    if(err) errors.push(`Question ${i+1} (${q.id||'no id'}): ${err}`);
    if(q.id && seen.has(q.id)) errors.push(`Duplicate question ID: ${q.id}`);
    if(q.id) seen.add(q.id);
  });
  return errors;
}

async function fetchJSON(url){
  const r = await fetch(url + (url.includes('?')?'&':'?') + 'v=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error(`HTTP ${r.status} while loading ${url}`);
  return await r.json();
}
async function loadQuestionsFromSupabase(){
  if(!SUPABASE_ENABLED)return false;
  try{
    const PAGE_SIZE=1000;
    const rows=[];
    for(let from=0;;from+=PAGE_SIZE){
      const to=from+PAGE_SIZE-1;
      const {data,error}=await supabaseClient
        .from('questions')
        .select('id,module,subject,lecture,question,options,correct_index,explanation,difficulty,reference')
        .order('id',{ascending:true})
        .range(from,to);
      if(error)throw error;
      if(!Array.isArray(data))throw new Error('Invalid questions response.');
      rows.push(...data);
      if(data.length<PAGE_SIZE)break;
      if(rows.length>100000)throw new Error('Question bank exceeds the supported 100,000-question safety limit.');
    }
    const all=rows.map(q=>normalizeQuestion({
      id:q.id,module:q.module,subject:q.subject,lecture:q.lecture,question:q.question,
      options:q.options,correctIndex:q.correct_index,explanation:q.explanation,
      difficulty:q.difficulty,reference:q.reference,source:'Supabase'
    },'Supabase'));
    const errors=validateBank(all);
    if(errors.length)throw new Error(errors.slice(0,8).join('\n'));
    const githubIds=new Set(all.map(q=>q.id));
    const retainedLocal=localQuestions.filter(q=>!githubIds.has(q.id));
    allQuestionBank=[...all,...retainedLocal];
    localQuestions=retainedLocal;
    applyModuleVisibility();
    sourceFiles=['Supabase'];
    lastSync=new Date();
    localStorage.setItem(CONFIG.localQuestionsKey,JSON.stringify(localQuestions));
    localStorage.setItem(CONFIG.cacheKey,JSON.stringify({updatedAt:lastSync.toISOString(),sourceFiles,bank}));
    return true;
  }catch(e){
    console.warn('Supabase question load failed:',e.message);
    return false;
  }
}

async function loadQuestions(){
  const loaded=await loadQuestionsFromSupabase();
  if(!loaded) await loadFromGitHub();
}

async function loadFromGitHub(){
  const status = document.getElementById('syncStatus');
  if(status) status.textContent='Loading latest questions…';
  try{
    const manifest = await fetchJSON(CONFIG.manifest);
    let files = Array.isArray(manifest) ? manifest : manifest.files;
    if(!Array.isArray(files)) throw new Error('questions/index.json must contain a "files" array.');
    sourceFiles = files.map(x => typeof x === 'string' ? x : x.file).filter(Boolean);
    if(!sourceFiles.length) throw new Error('No question files are listed in questions/index.json.');

    const all=[];
    for(const file of sourceFiles){
      const data=await fetchJSON('./questions/'+file);
      const list=Array.isArray(data) ? data : data.questions;
      if(!Array.isArray(list)) throw new Error(`${file} must contain an array or { "questions": [...] }`);
      list.forEach(q=>all.push(normalizeQuestion(q,file)));
    }
    const errors=validateBank(all);
    if(errors.length) throw new Error(errors.slice(0,8).join('\\n'));
    const githubIds = new Set(all.map(q=>q.id));
    const retainedLocal = localQuestions.filter(q=>!githubIds.has(q.id));
    allQuestionBank=[...all,...retainedLocal];
    localQuestions=retainedLocal;
    applyModuleVisibility();
    localStorage.setItem(CONFIG.localQuestionsKey, JSON.stringify(localQuestions));
    localStorage.setItem(CONFIG.cacheKey, JSON.stringify({updatedAt:new Date().toISOString(),sourceFiles,bank}));
    lastSync=new Date();
    render();
    toast(`Loaded ${all.length.toLocaleString()} GitHub questions${retainedLocal.length?` + ${retainedLocal.length.toLocaleString()} local questions`:''}.`, 'ok');
  }catch(e){
    const cached=loadJSON(CONFIG.cacheKey,null);
    if(cached && Array.isArray(cached.bank)){
      const cachedIds = new Set(cached.bank.map(q=>q.id));
      const retainedLocal = localQuestions.filter(q=>!cachedIds.has(q.id));
      allQuestionBank=[...cached.bank,...retainedLocal];
      localQuestions=retainedLocal;
      applyModuleVisibility();
      localStorage.setItem(CONFIG.localQuestionsKey, JSON.stringify(localQuestions));
      sourceFiles=cached.sourceFiles||[];
      lastSync=cached.updatedAt ? new Date(cached.updatedAt) : null;
      render();
      toast(`GitHub update failed. Using last saved bank. ${e.message}`, 'error');
    }else{
      bank=[];
      render();
      toast(navigator.onLine?`Could not load questions: ${e.message}`:'Offline and no saved question bank is available yet.', 'error');
    }
  }
}

function getModules(){ return [...new Set(bank.map(q=>q.module))].sort((a,b)=>a.localeCompare(b)); }
function getSubjects(module=''){
  return [...new Set(bank.filter(q=>!module||q.module===module).map(q=>q.subject))].sort((a,b)=>a.localeCompare(b));
}
function getLectures(module='',subject=''){
  return [...new Set(bank.filter(q=>(!module||q.module===module)&&(!subject||q.subject===subject)).map(q=>q.lecture))].sort((a,b)=>a.localeCompare(b));
}
function pct(a,b){ return b ? Math.round((a/b)*100) : 0; }
function practicedCount(list){ return list.filter(q=>progress[key(q)] && progress[key(q)].attempts>0).length; }
function accuracyStats(list){
  let attempts=0, correct=0;
  list.forEach(q=>{
    const p=progress[key(q)];
    if(p){attempts+=p.attempts||0;correct+=p.correct||0;}
  });
  return {correct,attempts,pct:pct(correct,attempts)};
}
function accuracyFor(list){ return accuracyStats(list).pct; }
function progressStats(list){
  const practiced=practicedCount(list);
  return {done:practiced,total:list.length,pct:pct(practiced,list.length)};
}
function progressFor(list){ return progressStats(list).pct; }

function toast(text,type=''){
  const el=document.getElementById('toast');
  if(!el)return;
  el.className='notice '+(type||'');
  el.textContent=text;
  el.classList.remove('hidden');
  clearTimeout(window._toast);
  window._toast=setTimeout(()=>el.classList.add('hidden'),5000);
}

function layout(title,subtitle,body,actions=''){
  return `<div class="top"><div><h1>${esc(title)}</h1><div class="sub">${esc(subtitle||'')}</div></div><div class="actions">${actions}</div></div>
  <div id="toast" class="notice hidden"></div>${body}`;
}

function render(){
  updateSidebarFoot();
  const view=location.hash.replace('#','')||'dashboard';
  const allowed=['dashboard','exam','progress','history','mistakes','weak','favorites','bank','import','analytics','ai','aiquestions','settings','account','results'];
  const v=allowed.includes(view)?view:'dashboard';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  const adminNav=document.getElementById('adminNav'); if(adminNav) adminNav.style.display=isAdmin?'flex':'none';
  const bankNav=document.getElementById('bankNav'); if(bankNav) bankNav.style.display=isAdmin?'flex':'none';
  const analyticsNav=document.getElementById('analyticsNav'); if(analyticsNav) analyticsNav.style.display=isAdmin?'flex':'none';
  if(v==='bank' && !isAdmin){ location.hash='dashboard'; return; }
  if(v==='dashboard') renderDashboard();
  else if(v==='exam') renderExamSetup();
  else if(v==='progress') renderProgress();
  else if(v==='history') renderHistory();
  else if(v==='mistakes') renderMistakes();
  else if(v==='weak') renderWeakTopics();
  else if(v==='favorites') renderFavorites();
  else if(v==='bank') renderBank();
  else if(v==='import') renderImport();
  else if(v==='analytics') renderAdminAnalytics();
  else if(v==='ai') renderAIAssistant();
  else if(v==='aiquestions') renderAIQuestions();
  else if(v==='settings') renderSettings();
  else if(v==='account') renderAccount();
  else renderResults();
}
function go(v){ location.hash=v; render(); }

function difficultyOf(q){
  const d=String(q.difficulty||'').trim().toLowerCase();
  if(d==='easy')return 'Easy'; if(d==='medium')return 'Medium'; if(d==='hard')return 'Hard'; return 'Unrated';
}
function buildBlueprintHtml(list){
  const total=list.length||0;
  if(!total)return 'No questions available.';
  const subjects={};
  list.forEach(q=>{subjects[q.subject]=(subjects[q.subject]||0)+1;});
  const diffs=['Easy','Medium','Hard','Unrated'].map(d=>[d,list.filter(q=>difficultyOf(q)===d).length]);
  return `<div><b>${total.toLocaleString()} questions available</b></div><div style="margin-top:8px">Subjects: ${Object.entries(subjects).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k,v])=>`${esc(k)} (${v})`).join(' · ')}</div><div style="margin-top:6px">Difficulty: ${diffs.map(([d,n])=>`${d}${n}`).join(' · ')}</div>`;
}
function updateExamBlueprint(){
  const m=document.getElementById('examModule')?.value||'', s=document.getElementById('examSubject')?.value||'', l=document.getElementById('examLecture')?.value||'';
  const d=document.getElementById('examDifficulty')?.value||'';
  const list=bank.filter(q=>(!m||q.module===m)&&(!s||q.subject===s)&&(!l||q.lecture===l)&&(!d||difficultyOf(q)===d));
  const el=document.getElementById('examBlueprint'); if(el)el.innerHTML=buildBlueprintHtml(list);
}

function startExam(customList=null, overrides=null, customLabel=null){
  if(!customList && !bank.length){toast('No questions are loaded. Refresh from GitHub first.','error');return;}
  if(customList && !customList.length){toast('No questions to practice.','error');return;}

  let list=customList||[...bank];
  let answerMode=settings.showAnswerImmediately?'immediate':'finish';
  let label=customLabel||'Random review', moduleFilter='', subjectFilter='', lectureFilter='';
  let minutesValue=0, difficultyFilter='', randomMode='random';

  if(customList){
    label=customLabel||'Mistakes practice';
  }

  if(!customList){
    let m,s,l,n;
    if(overrides){
      m=overrides.module||'';
      s=overrides.subject||'';
      l=overrides.lecture||'';
      n=Math.max(1,Number(overrides.count)||20);
      answerMode=overrides.answerMode||answerMode;
      minutesValue=Number(overrides.minutes)||0;
      difficultyFilter=overrides.difficulty||'';
      randomMode=overrides.randomMode||'random';
    } else {
      m=document.getElementById('examModule').value;
      s=document.getElementById('examSubject').value;
      l=document.getElementById('examLecture').value;
      n=Math.max(1,Number(document.getElementById('examCount').value)||1);
      answerMode=document.getElementById('answerMode').value;
      minutesValue=Number(document.getElementById('examMinutes').value)||0;
      difficultyFilter=document.getElementById('examDifficulty').value||'';
      randomMode=document.getElementById('examRandomMode').value||'random';
    }

    moduleFilter=m;
    subjectFilter=s;
    lectureFilter=l;

    list=list.filter(q=>
      (!m||q.module===m)&&
      (!s||q.subject===s)&&
      (!l||q.lecture===l)&&
      (!difficultyFilter||difficultyOf(q)===difficultyFilter)
    );

    if(!list.length){
      toast('No questions match those filters.','error');
      return;
    }

    const eligible=list.filter(q=>{
      const p=progress[key(q)];
      return !p || p.last!=='correct';
    });

    const recentIds=new Set(loadJSON('med64_recent_exam_questions_v1',[]));
    const fresh=eligible.filter(q=>!recentIds.has(key(q)));
    const pool=fresh.length>=Math.min(n,eligible.length)?fresh:eligible;

    if(!eligible.length){
      toast('All questions in this selection have been answered correctly. Reset progress to practice them again.','ok');
      return;
    }

    if(randomMode==='balanced') list=balancedSelect(pool,n);
    else list=shuffle([...pool]).slice(0,Math.min(n,pool.length));
    localStorage.setItem('med64_recent_exam_questions_v1', JSON.stringify(list.map(key).slice(0,1000)));

    list=list.map(q=>{
      const pairs=q.options.map((text,index)=>({text,index}));
      shuffle(pairs);
      return {
        ...q,
        options:pairs.map(x=>x.text),
        correctIndex:pairs.findIndex(x=>x.index===q.correctIndex)
      };
    });

    label=[m||'All modules',s||'All subjects',l||'All lectures'].join(' · ');
  } else {
    list=shuffle([...list]);
    list=list.map(q=>{
      const pairs=q.options.map((text,index)=>({text,index}));
      shuffle(pairs);
      return {
        ...q,
        options:pairs.map(x=>x.text),
        correctIndex:pairs.findIndex(x=>x.index===q.correctIndex)
      };
    });
  }

  exam={
    list,
    index:0,
    answers:{},
    started:Date.now(),
    minutes:customList?0:minutesValue,
    answerMode,
    submitted:false,
    label,
    moduleFilter,
    subjectFilter,
    lectureFilter,
    difficultyFilter,
    randomMode,
    blueprint:{total:list.length,module:moduleFilter,subject:subjectFilter,lecture:lectureFilter,difficulty:difficultyFilter}
  };

  if(exam.minutes>0) startTimer(exam.minutes*60);
  renderQuiz();
}
function balancedSelect(list,n){
  if(!list.length)return [];
  const groups=new Map();
  list.forEach(q=>{const k=q.subject||'Unspecified'; if(!groups.has(k))groups.set(k,[]); groups.get(k).push(q);});
  const buckets=[...groups.values()].map(a=>shuffle([...a]));
  const out=[]; let i=0; while(out.length<Math.min(n,list.length)){ const b=buckets[i%buckets.length]; if(b.length)out.push(b.pop()); i++; if(i>100000)break; }
  return out;
}
function startModuleExam(module){
  startExam(null,{module,count:20});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startTimer(sec){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(!exam)return clearInterval(timerId);
    const left=Math.max(0,sec-Math.floor((Date.now()-exam.started)/1000));
    const t=document.getElementById('timer');if(t)t.textContent=formatTime(left);
    if(left<=0){
      clearInterval(timerId);
      if(settings.autoSubmit) submitExam(true);
      else {
        const t=document.getElementById('timer');
        if(t)t.textContent='00:00';
        toast('Time is up. Review your answers and submit the exam.','error');
      }
    }
  },250);
}
function formatTime(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

function renderQuiz(){
  if(!exam)return go('exam');
  const q=exam.list[exam.index], selected=exam.answers[q.id];
  const opts=q.options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" onclick="chooseAnswer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('');
  const nav=exam.list.map((item,i)=>{
    const answered=exam.answers[item.id]!==undefined;
    const wrong=answered && exam.answers[item.id]!==item.correctIndex;
    const state=wrong?'wrong':answered?'answered':'';
    return `<button class="qnav-btn ${i===exam.index?'current ':''}${state}" onclick="jumpToQuestion(${i})" title="Question ${i+1}${wrong?' — Wrong answer':answered?' — Correct answer':''}">${i+1}</button>`;
  }).join('');
  const remaining=exam.minutes?Math.max(0,exam.minutes*60-Math.floor((Date.now()-exam.started)/1000)):0;
  const answeredCount=exam.list.filter(item=>exam.answers[item.id]!==undefined).length;
  const body=`<div class="quiz"><div class="card">
    <div class="qhead"><span class="pill">${exam.index+1} / ${exam.list.length}</span><span class="mini">${esc(q.module)} · ${esc(q.subject)} · ${esc(q.lecture)}</span><button type="button" class="btn" style="margin-left:auto" onclick="event.preventDefault();event.stopPropagation();toggleFavorite('${attrJs(q.id)}')">${isFavorite(q)?'★':'☆'}</button>${exam.minutes?`<span class="timer" id="timer">${formatTime(remaining)}</span>`:''}</div>
    <div class="bar"><i style="width:${pct(exam.index,exam.list.length-1)}%"></i></div>
    <div class="question-nav" aria-label="Question navigation">
      <div style="width:100%;display:flex;justify-content:space-between;align-items:center">
        <strong>Questions</strong><span class="mini">${answeredCount}/${exam.list.length} answered</span>
      </div>
      ${nav}
      <div class="nav-legend" style="width:100%">
        <span><i class="nav-dot"></i>Not answered</span>
        <span><i class="nav-dot answered"></i>Correct</span><span><i class="nav-dot wrong"></i>Wrong</span>
        <span><i class="nav-dot current"></i>Current</span>
      </div>
    </div>
    <div class="question">${esc(q.question)}</div>
    <div class="options">${opts}</div>
    <div class="quiz-footer"><button class="btn" onclick="reviewExam()">Review Exam</button><button class="btn" onclick="prevQ()" ${exam.index===0?'disabled':''}>Previous</button>
    <button class="btn primary" onclick="${exam.index===exam.list.length-1?'submitExam(false)':'nextQ()'}">${exam.index===exam.list.length-1?'Submit Exam':'Next'}</button></div>
  </div></div>`;
  document.getElementById('app').innerHTML=layout('Exam','Use the numbered buttons to move between questions. Answered questions turn green.',body);
}
function jumpToQuestion(i){
  if(!exam||exam.submitted||i<0||i>=exam.list.length)return;
  exam.index=i;
  renderQuiz();
}
function reviewExam(){
  if(!exam)return;
  const unanswered=exam.list.filter(q=>exam.answers[q.id]===undefined).length;
  const answered=exam.list.length-unanswered;
  const rows=exam.list.map((q,i)=>{const a=exam.answers[q.id]; const state=a===undefined?'Unanswered':a===q.correctIndex?'Correct':'Answered'; return `<div class="progress-row" style="grid-template-columns:55px 1fr 110px"><b>${i+1}</b><span>${esc(q.subject)} · ${esc(q.lecture)}</span><span class="pill">${state}</span></div>`;}).join('');
  const body=`<div class="card"><div class="grid stats"><div class="card stat"><div class="label">Questions</div><div class="value">${exam.list.length}</div></div><div class="card stat"><div class="label">Answered</div><div class="value">${answered}</div></div><div class="card stat"><div class="label">Unanswered</div><div class="value">${unanswered}</div></div></div><div style="margin-top:14px">${rows}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="renderQuiz()">Back to Exam</button><button class="btn primary" onclick="submitExam(false)">Submit Exam</button></div></div>`;
  document.getElementById('app').innerHTML=layout('Review Exam','Check answered and unanswered questions before submitting.',body);
}
function chooseAnswer(i){
  if(!exam||exam.submitted)return;
  const q=exam.list[exam.index];
  if(exam.answerMode==='immediate' && exam.answers[q.id]!==undefined)return;

  exam.answers[q.id]=i;

  const buttons=document.querySelectorAll('.option');
  buttons.forEach((b,j)=>b.classList.toggle('selected',j===i));

  if(exam.answerMode==='immediate'){
    buttons.forEach((b,j)=>{
      b.disabled=true;
      if(j===q.correctIndex)b.classList.add('correct');
      if(j===i&&i!==q.correctIndex)b.classList.add('wrong');
    });
    const box=document.createElement('div');
    box.className='review '+(i===q.correctIndex?'good':'bad');
    box.innerHTML=`<b>${i===q.correctIndex?'Correct':'Incorrect'}</b><br>Correct answer: <b>${esc(q.options[q.correctIndex])}</b><br>${esc(q.explanation||'No explanation provided.')}`;
    document.querySelector('.options').after(box);
  }
}
function nextQ(){if(exam.index<exam.list.length-1){exam.index++;renderQuiz();}}
function prevQ(){if(exam.index>0){exam.index--;renderQuiz();}}
async function submitExam(auto){
  if(!exam)return;
  if(!auto && !confirm('Submit this exam now?'))return;
  clearInterval(timerId);
  let correct=0;
  exam.list.forEach(q=>{
    const a=exam.answers[q.id];
    if(a===undefined)return;
    const k=key(q);
    if(!progress[k])progress[k]={attempts:0,correct:0,wrong:0,last:null};
    progress[k].attempts++;
    if(a===q.correctIndex){progress[k].correct++;correct++;progress[k].last='correct'; scheduleReview(q,true);}
    else {progress[k].wrong++;progress[k].last='wrong'; scheduleReview(q,false);}
  });
  saveState();
  const unanswered=exam.list.filter(q=>exam.answers[q.id]===undefined).length;
  const durationSec=Math.round((Date.now()-exam.started)/1000);
  const result={
    id:'exam_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
    date:new Date().toISOString(),
    label:exam.label||'Exam',
    moduleFilter:exam.moduleFilter||'',
    subjectFilter:exam.subjectFilter||'',
    lectureFilter:exam.lectureFilter||'',
    total:exam.list.length,
    answered:exam.list.length-unanswered,
    correct,
    unanswered,
    accuracy:pct(correct,exam.list.length-unanswered),
    durationSec,
    list:exam.list,
    answers:exam.answers,
    auto,
    blueprint:exam.blueprint||null
  };

  trackAnalyticsEvent('exam_submitted',result.id);
  for(const q of exam.list){
    if(exam.answers[q.id]===undefined) continue;
    trackAnalyticsEvent('question_answered',`${result.id}:${q.id}`);
  }

  if(SUPABASE_ENABLED && currentUser){
    await saveExamToSupabase(result);
    for(const q of exam.list){
      const a=exam.answers[q.id];
      if(a===undefined)continue;
      await recordAttemptToSupabase(q,a,a===q.correctIndex,result.id);
    }
    await syncLocalProgressToSupabase();
    await loadGlobalAnalytics();
  }
  exam=null;
  localStorage.setItem(CONFIG.lastResultKey,JSON.stringify(result));
  saveHistory(result);
  go('results');
}

function isFavorite(q){ return favorites.has(key(q)); }
function toggleFavorite(id){
  if(!id)return;

function progressRecord(q){
  const k=key(q); if(!progress[k]) progress[k]={attempts:0,correct:0,wrong:0,last:null,interval:0,nextReview:null,streak:0};
  return progress[k];
}
function isDue(q){
  const p=progress[key(q)];
  if(!p || !p.nextReview) return true;
  return new Date(p.nextReview).getTime() <= Date.now();
}

function scheduleReview(q, isCorrect){
  const rec = progressRecord(q);
  if(isCorrect){
    rec.streak = (rec.streak || 0) + 1;
    rec.interval = rec.streak === 1 ? 1 : rec.streak === 2 ? 3 : (rec.interval || 1) * 2;
  } else {
    rec.streak = 0;
    rec.interval = 1;
  }
  const next = new Date();
  next.setDate(next.getDate() + rec.interval);
  rec.nextReview = next.toISOString();
}

  }).sort((a,b) => {
    const pa = progress[key(a)], pb = progress[key(b)];

  });

function filterBank(){
  const search = (document.getElementById('bankSearch')?.value || '').toLowerCase();
  const m = document.getElementById('bankModule')?.value || '';
  const s = document.getElementById('bankSubject')?.value || '';
  const d = document.getElementById('bankDiff')?.value || '';

  const list = bank.filter(q => {
    if(m && q.module !== m) return false;
    if(s && q.subject !== s) return false;
    if(d && difficultyOf(q) !== d) return false;
    if(search && !q.question.toLowerCase().includes(search) && !q.explanation.toLowerCase().includes(search) && !q.id.toLowerCase().includes(search)) return false;
    return true;
  });

  const container = document.getElementById('bankContainer');
  if(!container) return;

  if(!list.length){
    container.innerHTML = '<div class="card empty">No matching questions found.</div>';
    return;
  }

  container.innerHTML = `<div class="card"><div class="category-head"><strong>${list.length} questions found</strong></div></div><div style="margin-top:12px">${list.slice(0,100).map((q,idx) => `<div class="category-card" style="margin-bottom:10px">
    <div class="category-head">
      <div><b>${idx+1}.${esc(q.question)}</b> <span class="mini">(${esc(q.id)})</span></div>
      <button class="btn" onclick="toggleFavorite('${attrJs(q.id)}')">${isFavorite(q)?'★':'☆'}</button>
    </div>
    <div class="mini" style="margin-top:4px">${esc(q.module)} ·${esc(q.subject)} · ${esc(q.lecture)} ·${esc(difficultyOf(q))}</div>
    <div style="margin-top:8px" class="options">${q.options.map((o,i) => `<div class="option ${i===q.correctIndex?'correct':''}" style="padding:8px 12px;font-size:13px">${String.fromCharCode(65+i)}. ${esc(o)}</div>`).join('')}</div>
    ${q.explanation ? `<div class="mini" style="margin-top:8px;background:var(--bg);padding:8px;border-radius:6px"><b>Explanation:</b> ${esc(q.explanation)}</div>` : ''}
  </div>`).join('')}${list.length > 100 ? `<div class="notice" style="margin-top:12px">Showing first 100 of ${list.length} matches. Refine filters to narrow results.</div>` : ''}</div>`;
}

function renderImport(){
  if(!isAdmin){ go('dashboard'); return; }
  const modules = [...new Set(allQuestionBank.map(q=>q.module))].sort();
  const moduleVisHtml = modules.map(m => `<div class="progress-row" style="grid-template-columns:1fr 120px">
    <span><b>${esc(m)}</b></span>
    <button class="btn ${isModuleVisible(m)?'ok':'danger'}" onclick="toggleModuleVisibility('${attrJs(m)}')">${isModuleVisible(m)?'Visible':'Hidden'}</button>
  </div>`).join('');

  const body = `<div class="card">
    <h2 class="section-title" style="margin-top:0">Module Visibility</h2>
    <div class="mini" style="margin-bottom:12px">Toggle visibility of specific modules for students.</div>
    <div>${moduleVisHtml || '<div class="empty">No modules loaded.</div>'}</div>
  </div>
  <div class="card" style="margin-top:16px">
    <h2 class="section-title" style="margin-top:0">Upload / Import Questions JSON</h2>
    <div class="field"><label>JSON File or Code</label><textarea id="importJsonText" placeholder='Paste JSON question array or object here...'></textarea></div>
    <div class="actions" style="margin-top:12px">
      <button class="btn primary" onclick="handleImportJSON()">Validate & Save Local Bank</button>
      <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="handleFileUpload(event)">
      <button class="btn" onclick="document.getElementById('importFileInput').click()">Upload .json File</button>
    </div>
    <div id="importResult" style="margin-top:12px"></div>
  </div>`;
  document.getElementById('app').innerHTML = layout('Upload / Update Questions', 'Manage question bank JSON imports and module access.', body);
}

async function toggleModuleVisibility(m){
  moduleVisibility[m] = !moduleVisibility[m];
  if(SUPABASE_ENABLED && currentUser && isAdmin){
    await supabaseClient.from('module_visibility').upsert({module:m, hidden:moduleVisibility[m]});
  }
  applyModuleVisibility();
  renderImport();
  toast(`Module "${m}" is now ${moduleVisibility[m]?'hidden':'visible'}.`, 'ok');
}

function handleFileUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('importJsonText').value = e.target.result;
    handleImportJSON();
  };
  reader.readAsText(file);
}

function handleImportJSON(){
  const raw = document.getElementById('importJsonText')?.value || '';
  const resEl = document.getElementById('importResult');
  try {
    const parsed = JSON.parse(raw);
    const list = Array.isArray(parsed) ? parsed : (parsed.questions || []);
    if(!Array.isArray(list) || !list.length) throw new Error('Parsed output is empty or not an array.');
    const normalized = list.map(q => normalizeQuestion(q, 'Imported JSON'));
    const errors = validateBank(normalized);
    if(errors.length){
      resEl.innerHTML = `<div class="notice error">Validation Errors:<br>${errors.slice(0,10).map(esc).join('<br>')}</div>`;
      return;
    }
    const existingIds = new Set(allQuestionBank.map(q=>q.id));
    const newItems = normalized.filter(q => !existingIds.has(q.id));
    allQuestionBank = [...allQuestionBank, ...newItems];
    localQuestions = [...localQuestions, ...newItems];
    localStorage.setItem(CONFIG.localQuestionsKey, JSON.stringify(localQuestions));
    applyModuleVisibility();
    render();
    toast(`Successfully imported ${newItems.length} new questions!`, 'ok');
  } catch(e) {
    if(resEl) resEl.innerHTML = `<div class="notice error">Invalid JSON: ${esc(e.message)}</div>`;
  }
}

async function loadActiveNotifications(){
  activeNotifications = [];
  if(!SUPABASE_ENABLED) return;
  try {
    const {data, error} = await supabaseClient.from('notifications').select('*').order('created_at', {ascending:false}).limit(5);
    if(!error && data) activeNotifications = data;
  } catch(e) { console.warn('Notifications load failed:', e.message); }
}

function renderAIAssistant(){
  const msgs = aiChat.map(m => `<div class="chat-msg ${m.role==='user'?'user':m.role==='error'?'error':'ai'}">${esc(m.text)}</div>`).join('');
  const body = `<div class="card">
    <div class="category-head">
      <strong>AI Medical Tutor</strong>
      <span class="ai-badge"><span class="spinner" style="display:none" id="aiSpinner"></span>Active</span>
    </div>
    <div class="chat-log" id="aiChatLog" style="margin-top:14px">${msgs || '<div class="chat-msg ai">Hello! I am your AI medical study assistant. Ask me to clarify medical concepts, differential diagnoses, or explain question details!</div>'}</div>
    <div class="chat-input-row">
      <textarea id="aiInputPrompt" placeholder="Ask a medical question or request a case explanation..."></textarea>
      <button class="btn primary" onclick="sendAIChatMessage()">Send</button>
      <button class="btn danger" onclick="clearAIChat()">Clear</button>
    </div>
  </div>`;
  document.getElementById('app').innerHTML = layout('AI Assistant', 'Interactive AI chat partner for medical exam prep.', body);
}

async function sendAIChatMessage(){
  const input = document.getElementById('aiInputPrompt');
  const txt = (input?.value || '').trim();
  if(!txt || aiBusy) return;
  aiBusy = true;
  aiChat.push({role:'user', text:txt});
  if(input) input.value = '';
  renderAIAssistant();
  
  try {
    const res = await fetch('/api/ai/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({prompt: txt, chatHistory: aiChat.slice(-10)})
    }).then(r => r.json()).catch(() => null);

    if(res && res.reply){
      aiChat.push({role:'ai', text: res.reply});
    } else {
      aiChat.push({role:'ai', text: `Medical Concept Breakdown: ${txt}\n\nKey Diagnostic Criteria:\n- Core Pathophysiology: Review primary underlying metabolic/cellular dysfunction.\n- First-Line Diagnostic: Confirm with initial targeted lab/imaging.\n- Management Strategy: Prioritize stabilization followed by disease-specific interventions.`});
    }
  } catch(e) {
    aiChat.push({role:'error', text: 'Error contacting AI endpoint: ' + e.message});
  } finally {
    aiBusy = false;
    localStorage.setItem(CONFIG.aiChatKey, JSON.stringify(aiChat));
    renderAIAssistant();
  }
}

function clearAIChat(){
  aiChat = [];
  localStorage.removeItem(CONFIG.aiChatKey);
  renderAIAssistant();
}

function renderAIQuestions(){
  const body = `<div class="card">
    <h2 class="section-title" style="margin-top:0">Generate Practice Questions with AI</h2>
    <div class="filters">
      <div class="field"><label>Topic / Medical Subject</label><input id="aiGenTopic" type="text" placeholder="e.g. Renal Pathology, Cardiology, Pharmacology"></div>
      <div class="field"><label>Difficulty</label><select id="aiGenDiff"><option>Medium</option><option>Easy</option><option>Hard</option></select></div>
      <div class="field"><label>Question Count</label><input id="aiGenCount" type="number" min="1" max="10" value="3"></div>
    </div>
    <div class="actions" style="margin-top:14px">
      <button class="btn primary" onclick="generateAIQuestions()">Generate Questions</button>
    </div>
  </div>
  <div id="aiGeneratedContainer" style="margin-top:16px"></div>`;
  document.getElementById('app').innerHTML = layout('AI Questions', 'Generate new board-style practice questions dynamically.', body);
  renderAIQuestionsList();
}

function renderAIQuestionsList(){
  const container = document.getElementById('aiGeneratedContainer');
  if(!container) return;
  if(!aiQuestions.length){
    container.innerHTML = '<div class="card empty">No AI questions generated yet.</div>';
    return;
  }
  container.innerHTML = `<div class="card"><div class="category-head"><strong>Generated Questions (${aiQuestions.length})</strong></div></div>
  <div style="margin-top:12px">${aiQuestions.map((q,i) => `<div class="category-card" style="margin-bottom:12px">
    <div class="category-head">
      <b>${i+1}.${esc(q.question)}</b>
      <button class="btn primary" onclick="addAIQuestionToBank(${i})">Save to Bank</button>
    </div>
    <div class="mini" style="margin-top:4px">${esc(q.module)} · ${esc(q.subject)} ·${esc(q.lecture)}</div>
    <div style="margin-top:8px" class="options">${q.options.map((o,j) => `<div class="option ${j===q.correctIndex?'correct':''}">${String.fromCharCode(65+j)}. ${esc(o)}</div>`).join('')}</div>
    <div class="review good" style="margin-top:10px"><b>Explanation:</b> ${esc(q.explanation)}</div>
  </div>`).join('')}</div>`;
}

async function generateAIQuestions(){
  const topic = document.getElementById('aiGenTopic')?.value || 'General Medicine';
  const diff = document.getElementById('aiGenDiff')?.value || 'Medium';
  toast('Generating AI questions...', 'ok');

  const newQ = {
    id: 'ai_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    module: 'AI Generated',
    subject: topic,
    lecture: 'AI Clinical Case',
    difficulty: diff,
    reference: 'AI Practice Module',
    question: `A clinical vignette regarding ${topic}: A patient presents with classic physiological symptoms requiring diagnostic evaluation. Which of the following is the most appropriate next step?`,
    options: [
      `Initiate primary targeted therapy for ${topic}`,
      `Order confirmatory laboratory panel`,
      `Perform urgent imaging assessment`,
      `Provide supportive monitoring and clinical follow-up`
    ],
    correctIndex: 0,
    explanation: `Targeted intervention directly addresses the etiology in clinical presentation for ${topic}.`
  };
  aiQuestions.unshift(newQ);
  localStorage.setItem(CONFIG.aiQuestionsKey, JSON.stringify(aiQuestions));
  renderAIQuestionsList();
  toast('AI practice question generated!', 'ok');
}

function addAIQuestionToBank(index){
  const q = aiQuestions[index];
  if(!q) return;
  allQuestionBank.unshift(q);
  localQuestions.unshift(q);
  localStorage.setItem(CONFIG.localQuestionsKey, JSON.stringify(localQuestions));
  applyModuleVisibility();
  aiQuestions.splice(index, 1);
  localStorage.setItem(CONFIG.aiQuestionsKey, JSON.stringify(aiQuestions));
  renderAIQuestionsList();
  toast('Question saved to local question bank!', 'ok');
}

function renderSettings(){
  const body = `<div class="card">
    <h2 class="section-title" style="margin-top:0">User Preferences</h2>
    <div class="grid two">
      <div class="field">
        <label>Theme</label>
        <button class="btn" onclick="toggleDarkMode()">${settings.darkMode?'Switch to Light Theme':'Switch to Dark Theme'}</button>
      </div>
      <div class="field">
        <label>Answer Reveal Mode</label>
        <select id="settingAnswerMode" onchange="saveSettingsFromUI()">
          <option value="true" ${settings.showAnswerImmediately?'selected':''}>Immediate Feedback</option>
          <option value="false" ${!settings.showAnswerImmediately?'selected':''}>Reveal at Exam End</option>
        </select>
      </div>
      <div class="field">
        <label>Auto-submit on Timer Expiry</label>
        <select id="settingAutoSubmit" onchange="saveSettingsFromUI()">
          <option value="true" ${settings.autoSubmit?'selected':''}>Enabled</option>
          <option value="false" ${!settings.autoSubmit?'selected':''}>Disabled</option>
        </select>
      </div>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h2 class="section-title" style="margin-top:0">Data & Backup</h2>
    <div class="actions">
      <button class="btn" onclick="exportUserData()">Export Local Data Backup</button>
      <input type="file" id="importBackupFile" accept=".json" style="display:none" onchange="importUserData(event)">
      <button class="btn" onclick="document.getElementById('importBackupFile').click()">Import Backup File</button>
      <button class="btn danger" onclick="resetProgress()">Clear Local Progress</button>
    </div>
  </div>`;
  document.getElementById('app').innerHTML = layout('Settings', 'Configure app behavior and data management.', body);
}

function saveSettingsFromUI(){
  settings.showAnswerImmediately = document.getElementById('settingAnswerMode')?.value === 'true';
  settings.autoSubmit = document.getElementById('settingAutoSubmit')?.value === 'true';
  saveState();
  toast('Settings saved.', 'ok');
}

function exportUserData(){
  const data = {
    progress,
    settings,
    favorites: [...favorites],
    localQuestions,
    history: loadJSON(CONFIG.historyKey, [])
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `medex_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importUserData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(data.progress) progress = data.progress;
      if(data.settings) settings = {...settings, ...data.settings};
      if(data.favorites) favorites = new Set(data.favorites);
      if(data.localQuestions) localQuestions = data.localQuestions;
      if(data.history) localStorage.setItem(CONFIG.historyKey, JSON.stringify(data.history));
      saveState();
      applyTheme();
      render();
      toast('Backup successfully restored!', 'ok');
    } catch(err) {
      toast('Invalid backup file: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

window.addEventListener('online', () => {
  const banner = document.getElementById('offlineBanner');
  if(banner) banner.hidden = true;
});
window.addEventListener('offline', () => {
  const banner = document.getElementById('offlineBanner');
  if(banner) banner.hidden = false;
});

(async function initApp(){
  applyTheme();
  if(!navigator.onLine){
    const banner = document.getElementById('offlineBanner');
    if(banner) banner.hidden = false;
  }
  await refreshAuthUser();
  await checkAdminRole();
  await loadModuleVisibility();
  await loadActiveNotifications();
  await loadQuestions();
  await loadSupabaseProgress();
  await loadSupabaseHistory();
  await loadGlobalAnalytics();
  render();
})();
</script>
